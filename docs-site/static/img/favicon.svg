<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Cabeção</title>
  <!-- Ícone simplificado para 16 e 32 px: o arco e a nota lembrada. Segue o tema do sistema. -->
  <style>
    .ink { stroke: #1C3D8F; }
    .dot { fill: #1C3D8F; }
    .spark { fill: #D92E45; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #A9C1FF; }
      .dot { fill: #A9C1FF; }
      .spark { fill: #FF7385; }
    }
  </style>
  <path class="ink" d="M24.2 8.6A10.5 10.5 0 1 0 24.2 23.4" fill="none" stroke-width="5" stroke-linecap="round"/>
  <circle class="dot" cx="24.2" cy="8.6" r="3.2"/>
  <circle class="dot" cx="24.2" cy="23.4" r="3.2"/>
  <circle class="spark" cx="15.5" cy="16" r="3.6"/>
</svg>
