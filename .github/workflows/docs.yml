# Site de documentação (docs-site/, Docusaurus). Separado do CI do produto: só roda quando o site muda.
# Em PR, só constrói (o build falha com link ou âncora interna quebrada). Na main, constrói e publica no GitHub Pages.
# O GitHub Pages precisa estar ligado uma vez, com a origem "GitHub Actions" (Settings > Pages > Source).
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: constrói o site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter cabecao-docs
      - name: build (com verificação de links internos)
        run: pnpm docs:build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/build

  deploy:
    name: publica no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
