# CI do projeto. O Cabeção em uso não depende de CI nem do GitHub; isto vale só para este repositório.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # O workflow release dispara este workflow na branch do PR "Version Packages", que não dispararia o CI
  # sozinho por ter sido criada pelo GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node -v && npm -v && pnpm -v
      - run: pnpm install --frozen-lockfile --filter '!cabecao-docs' # o site tem workflow próprio (docs.yml)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: smoke do bundle
        run: pnpm smoke
      - name: ponta a ponta com duas máquinas e um remoto local
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          name: cli-dist
          path: packages/cli/dist/
          if-no-files-found: error
          include-hidden-files: true

  node-limits:
    # Roda o bundle pronto nas bordas da faixa de versões: o piso exato tem de funcionar,
    # e as versões fora da faixa têm de ser recusadas com a mensagem clara.
    name: bundle em node ${{ matrix.node }} (${{ matrix.expect }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.16.0"
            expect: supported
          - node: "20"
            expect: unsupported
          - node: "22.15.0"
            expect: unsupported
          - node: "23"
            expect: unsupported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cli-dist
          path: packages/cli/dist
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node -v
      - name: smoke do bundle
        env:
          SMOKE_EXPECT: ${{ matrix.expect }}
        run: node scripts/smoke.mjs

  changeset:
    # PR que mexe em packages/ sem changeset só ganha um aviso: nem toda mudança precisa de versão nova.
    # Um changeset que cita outro pacote além do cabecao falha: os pacotes privados nunca são consumidos e travam o PR
    # de versão.
    name: changeset
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: o PR traz changeset?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          added="$(git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA")"
          changesets="$(grep -E '^\.changeset/[^/]+\.md$' <<< "$added" | grep -v '^\.changeset/README\.md$' || true)"

          status=0
          for file in $changesets; do
            # Cabeçalho entre as duas primeiras linhas "---": uma linha por pacote; vazio é changeset --empty.
            header="$(awk 'NR == 1 && $0 == "---" { inside = 1; next } inside && $0 == "---" { exit } inside' "$file")"
            if grep -Ev "^[\"']?cabecao[\"']?[[:space:]]*:" <<< "$header" | grep -q '[^[:space:]]'; then
              echo "::error file=$file::o changeset cita outro pacote além do cabecao. Os pacotes @cabecao/* são privados e o Changesets recusa citá-los: use pnpm changeset e marque só o cabecao."
              status=1
            fi
          done

          if grep -q '^packages/' <<< "$changed" && [ -z "$changesets" ]; then
            echo "::warning::este PR mexe em packages/ e não traz changeset, então não gera versão nova. Se a mudança deve sair no npm, rode pnpm changeset; se não deve, pnpm changeset --empty silencia este aviso."
          fi
          exit "$status"

  package:
    # Confere o pacote que vai para o npm, sem publicar nada.
    name: pacote npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter '!cabecao-docs' # o site tem workflow próprio (docs.yml)
      - run: pnpm build
      - name: publint
        working-directory: packages/cli
        run: pnpm exec publint --strict
      - name: npm publish --dry-run sem avisos
        working-directory: packages/cli
        run: |
          # Versão de pré-lançamento (X.Y.Z-beta.N) só publica com etiqueta explícita.
          tag="$(node -p "(require('./package.json').version.split('-')[1] || 'latest').split('.')[0]")"
          npm publish --dry-run --tag "$tag" 2>&1 | tee "$RUNNER_TEMP/publish.log"
          # O CI não tem login no npm, de propósito: o aviso de login é o único tolerado.
          if grep -Ei 'npm (warn|error)' "$RUNNER_TEMP/publish.log" | grep -v 'requires you to be logged in'; then
            echo "::error::npm publish --dry-run emitiu aviso ou erro"
            exit 1
          fi
      - name: instala o tarball e roda o comando instalado
        run: |
          cd packages/cli && npm pack --pack-destination "$RUNNER_TEMP" && cd -
          mkdir "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/cabecao-*.tgz
          test "$(npx --no-install cabecao --version)" = "$(node -p "require('$GITHUB_WORKSPACE/packages/cli/package.json').version")"
          test -z "$(ls node_modules | grep -v '^cabecao$')"
